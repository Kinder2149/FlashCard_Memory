<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  body {
    font-family: "Segoe UI", Roboto, -apple-system, sans-serif;
    background: linear-gradient(135deg, #2f5a94 0%, #3F6FB0 45%, #5c8fd0 100%);
    color: #fff;
    display: flex;
    align-items: center;
    position: relative;
  }
  .left {
    padding: 0 0 0 72px;
    width: 620px;
    z-index: 2;
  }
  .title {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.05;
  }
  .title span { color: #ffd54a; }
  .tag {
    margin-top: 20px;
    font-size: 26px;
    font-weight: 400;
    opacity: .95;
    line-height: 1.35;
  }
  .badges {
    margin-top: 34px;
    display: flex;
    gap: 14px;
  }
  .badge {
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.35);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 19px;
    font-weight: 600;
  }
  /* Cartes stylisées à droite */
  .cards { position: absolute; right: 60px; top: 0; height: 500px; width: 380px; }
  .card {
    position: absolute;
    width: 240px;
    height: 150px;
    border-radius: 20px;
    box-shadow: 0 18px 40px rgba(0,0,0,.28);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 700;
  }
  .card.fr { background: #ffffff; color: #2f5a94; top: 120px; right: 90px; transform: rotate(-8deg); }
  .card.en { background: #ffd54a; color: #4a3b00; top: 230px; right: 30px; transform: rotate(6deg); }
  .arrow { position: absolute; top: 205px; right: 150px; font-size: 40px; color: rgba(255,255,255,.9); transform: rotate(20deg); z-index: 1;}
</style>
</head>
<body>
  <div class="left">
    <div class="title">Flashcard <span>Memory</span></div>
    <div class="tag">Révisez votre vocabulaire<br>par flashcards — à votre rythme.</div>
    <div class="badges">
      <div class="badge">Saisie</div>
      <div class="badge">QCM</div>
      <div class="badge">Hors ligne</div>
    </div>
  </div>
  <div class="cards">
    <div class="card fr">chat</div>
    <div class="arrow">➜</div>
    <div class="card en">cat</div>
  </div>
</body>
</html>
